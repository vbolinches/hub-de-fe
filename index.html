<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2456">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hub de Fe</title>
<meta name="description" content="Santo Rosario, novenas, coronilla y oraciones de cada día con voz guiada, tus intenciones y recordatorios.">
<meta property="og:title" content="Hub de Fe">
<meta property="og:description" content="Reza el Rosario, novenas, la coronilla y las oraciones de cada día con voz guiada.">
<meta property="og:image" content="https://vbolinches.github.io/hub-de-fe/icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="preload" href="catalog.json" as="fetch" crossorigin>
<link rel="preload" href="devociones/divino-nino/data.json" as="fetch" crossorigin>
<style>
:root{
  --noche:#1F2456; --noche-2:#2C3270; --cenidor:#3D5BB0; --rosa:#E5789B; --rosa-txt:#B03F68; --rosa-2:#F7D3DF; --oro:#E8B64C; --oro-2:#F8E6BC;
  --bg:#F2F0FA; --surface:#FFFFFF; --surface-2:#E9E6F5; --ink:#221B3A; --ink-2:#5E5878; --line:#DCD7EC;
  --display:"Marcellus",Georgia,serif; --read:"Lora",Georgia,serif; --ui:"Figtree",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tabh:74px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root{--rosa-txt:#F0A3BB;
  --bg:#13152E; --surface:#1D2044; --surface-2:#272B57; --ink:#F1EEFA; --ink-2:#A8A3C4; --line:#2F3463; --rosa-2:#4A2A44; --oro-2:#4A3B1C;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 700px at 20% 0%,#3A3F8F 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#5B2E57 0%,transparent 55%),var(--noche);}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400;font-family:var(--display);letter-spacing:.2px}

/* ---------- Marco de app ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px}
.app{position:relative;width:100%;max-width:420px;height:min(880px,calc(100dvh - 56px));background:var(--bg);border-radius:38px;overflow:hidden;
  box-shadow:0 0 0 10px #0E1030,0 0 0 11px #3B3F7A,0 40px 80px rgba(0,0,0,.45);display:flex;flex-direction:column}
/* En el teléfono la app ocupa toda la pantalla anclada a los cuatro bordes. No se usa 100dvh: en el iPhone,
   con la app instalada, esa medida resulta más baja que la pantalla y dejaba franjas vacías arriba y abajo. */
@media (max-width:520px),(display-mode:standalone){
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  .stage{padding:0;min-height:0}
  .app{position:fixed;inset:0;width:auto;height:auto;max-width:none;border-radius:0;box-shadow:none}}
/* App instalada en el iPhone (WebKit 237961/254868): con viewport-fit=cover, "inset:0", "bottom:0" y "100%" se quedan
   cortos justo la altura de la barra de estado y dejan una franja vacía abajo. 100vh sí mide la pantalla entera. */
@media (display-mode:standalone){
  html,body{height:100vh}
  .app{position:absolute;top:0;left:0;right:0;bottom:auto;height:100vh}}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:calc(var(--safe-t) + 8px) 0 calc(var(--tabh) + var(--safe-b) + 24px);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.enter{animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Tabs ---------- */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);height:calc(var(--tabh) + var(--safe-b));padding-bottom:var(--safe-b);
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:600;color:var(--ink-2);position:relative}
.tab svg{width:27px;height:27px}
.tab.on{color:var(--cenidor)}
@media (prefers-color-scheme:dark){.tab.on{color:var(--oro)}}
.tab.on::before{content:"";position:absolute;top:7px;width:52px;height:34px;border-radius:15px;background:color-mix(in srgb,var(--cenidor) 13%,transparent);z-index:-1}
.badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--rosa);color:#fff;font-size:10.5px;display:grid;place-items:center}

/* ---------- Encabezados ---------- */
.greet{padding:14px 20px 4px}
.greet .hello{font-family:var(--display);font-size:34px;line-height:1.1}
.greet .date{color:var(--ink-2);font-size:18px;margin-top:4px}
.screen-title{padding:18px 20px 10px;font-size:30px;font-family:var(--display)}
.sub{color:var(--ink-2);font-size:16px}

/* ---------- Custodia (progreso) ---------- */
.custodia{position:relative;width:260px;height:260px;margin:6px auto 0}
.custodia svg{position:absolute;inset:0;overflow:visible}
.custodia .ray{transition:fill .6s}
.custodia .face{position:absolute;left:50%;top:50%;width:132px;height:132px;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;
  box-shadow:0 0 0 4px var(--oro),0 0 0 9px color-mix(in srgb,var(--oro) 30%,transparent),0 14px 40px rgba(31,36,86,.35)}
.custodia .face img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.ray.today{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ray.lit{animation:lit .9s var(--ease)}
@keyframes lit{0%{opacity:0}40%{opacity:1;filter:drop-shadow(0 0 8px var(--oro))}}

/* ---------- Hoy ---------- */
.today-head{text-align:center;padding:8px 24px 0}
.today-head .day{font-size:16px;font-weight:600;color:var(--rosa-txt)}
.today-head h1{font-size:30px;line-height:1.15;margin-top:2px}
.today-head .meta{color:var(--ink-2);font-size:16.5px;margin-top:6px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px auto 0;width:calc(100% - 40px);height:58px;border-radius:29px;
  background:linear-gradient(135deg,var(--noche) 0%,var(--cenidor) 100%);color:#fff;font-weight:700;font-size:17px;box-shadow:0 10px 26px rgba(61,91,176,.38);transition:transform .12s}
.cta:active{transform:scale(.97)}
.cta .pl{width:34px;height:34px;border-radius:50%;background:var(--oro);display:grid;place-items:center;color:var(--noche)}
.ghost-link{display:block;margin:12px auto 0;color:var(--cenidor);font-weight:600;font-size:14.5px}
@media (prefers-color-scheme:dark){.ghost-link{color:var(--oro)}}
.practica{margin:26px 20px 0;padding:18px 18px 18px 20px;border-radius:22px;background:var(--oro-2);position:relative}
.practica h3,.practica .h3{font-size:19px;color:#8A6411}
@media (prefers-color-scheme:dark){.practica h3{color:var(--oro)}}
.practica p{font-family:var(--read);font-size:16.5px;line-height:1.6;margin:6px 0 0}
.row-card{display:flex;align-items:center;gap:14px;margin:12px 20px 0;padding:14px 16px;border-radius:20px;background:var(--surface);width:calc(100% - 40px);text-align:left}
.row-card .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.row-card .t{font-weight:600}
.row-card .s{font-size:13.5px;color:var(--ink-2)}
.row-card .chev{margin-left:auto;color:var(--ink-2)}
.hint{margin:10px 20px 0;padding:14px 16px;border-radius:16px;background:var(--surface-2);font-size:16px;color:var(--ink-2)}

/* ---------- Novena (línea de tiempo) ---------- */
.nov-hero{position:relative;height:300px;margin-top:calc(-8px - var(--safe-t))}
.nov-hero img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.nov-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,36,86,.15) 0%,rgba(31,36,86,0) 35%,rgba(31,36,86,.92) 100%)}
.nov-hero .cap{position:absolute;left:20px;right:20px;bottom:18px;z-index:2;color:#fff}
.nov-hero h1{font-size:31px;line-height:1.1}
.nov-hero .s{opacity:.85;font-size:14.5px;margin-top:4px}
.back-pill{display:inline-flex;align-items:center;gap:4px;height:46px;padding:0 18px 0 10px;border-radius:23px;background:var(--surface);color:var(--noche);font-weight:700;font-size:17px;box-shadow:0 2px 8px rgba(31,36,86,.12)}
.back-pill svg{width:22px;height:22px}
.back-pill.on-img{position:absolute;top:calc(var(--safe-t) + 12px);left:14px;z-index:3;background:rgba(255,255,255,.92)}
@media (prefers-color-scheme:dark){.back-pill{color:var(--ink)}.back-pill.on-img{color:var(--noche)}}
.back-fab{position:absolute;top:calc(var(--safe-t) + 12px);left:14px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.88);color:var(--noche);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.timeline{position:relative;margin:18px 20px 0;padding-left:0}
.tl{display:grid;grid-template-columns:34px 64px 1fr auto;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left;position:relative}
.tl .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1}
.tl.done .num{background:var(--oro);border-color:var(--oro);color:var(--noche)}
.tl.next .num{border-color:var(--rosa);color:var(--rosa-txt)}
.tl:not(:last-child)::before{content:"";position:absolute;left:16px;top:44px;bottom:-14px;width:2px;background:var(--line)}
.tl.done:not(:last-child)::before{background:var(--oro)}
.tl img{width:64px;height:64px;border-radius:16px;object-fit:cover}
.tl .tt{font-family:var(--display);font-size:18px;line-height:1.15}
.tl .dd{font-size:13px;color:var(--ink-2)}
.tl .go{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--cenidor)}
.tl.next .go{background:var(--rosa);color:#fff}

/* ---------- Devociones ---------- */
.feature{position:relative;margin:4px 20px 0;height:210px;border-radius:28px;overflow:hidden;display:block;width:calc(100% - 40px);text-align:left}
.feature img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.feature::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(31,36,86,.95))}
.feature .cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#fff}
.feature h2{font-size:25px;line-height:1.1}
.feature .bar{display:flex;gap:4px;margin-top:10px}
.feature .bar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.28)}
.feature .bar i.on{background:var(--oro)}
.section{padding:28px 22px 8px;font-family:var(--display);font-size:24px}
.soon{display:flex;align-items:center;gap:14px;padding:14px 20px}
.soon .art{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.soon .t{font-weight:600}
.soon .s{font-size:13.5px;color:var(--ink-2)}
.soon .tag{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);padding:4px 10px;border-radius:10px;white-space:nowrap}

/* ---------- Intenciones ---------- */
.int{display:flex;gap:12px;align-items:flex-start;margin:10px 20px 0;padding:14px 14px 14px 16px;border-radius:20px;background:var(--surface);position:relative;overflow:hidden}
.int::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rosa)}
.int.ok::before{background:var(--oro)}
.int .tx{flex:1;overflow-wrap:anywhere;min-width:0;font-family:var(--read);font-size:16.5px;line-height:1.5;white-space:pre-wrap}
.int .when{font-family:var(--ui);font-size:12.5px;color:var(--ink-2);margin-top:4px}
.int.ok .tx{color:var(--ink-2)}
.int .acts{display:flex;flex-direction:column;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.icon-btn.gold{background:var(--oro-2);color:#8A6411}
.empty{margin:30px 28px;text-align:center;color:var(--ink-2)}
.empty .big{font-family:var(--display);font-size:22px;color:var(--ink);margin-bottom:6px}
.fab{position:absolute;right:18px;bottom:calc(var(--tabh) + var(--safe-b) + 16px);z-index:25;height:56px;padding:0 22px 0 18px;border-radius:28px;background:var(--rosa);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(229,120,155,.45)}
.seg{display:flex;margin:4px 20px 6px;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- Ajustes ---------- */
.group{margin:8px 20px 0;border-radius:20px;background:var(--surface);overflow:hidden}
.group-h{padding:22px 24px 6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.cell{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.cell:last-child{border-bottom:0}
.cell .k{flex:1;font-weight:500}
.cell .v{color:var(--ink-2);font-size:15px}
.cell input[type=date],.cell input[type=time]{border:0;background:var(--surface-2);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-size:15px}
.cell .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.cell.action .k{color:var(--cenidor);font-weight:600}
@media (prefers-color-scheme:dark){.cell.action .k{color:var(--oro)}}
.cell.done-cell .v{color:#8A6411;font-weight:600}
.foot{padding:18px 24px;font-size:13px;color:var(--ink-2)}
.foot a{color:inherit}

/* ---------- Mini reproductor ---------- */
.mini{position:absolute;left:10px;right:10px;bottom:calc(var(--tabh) + var(--safe-b) + 8px);z-index:28;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;border-radius:20px;
  background:var(--noche);color:#fff;box-shadow:0 12px 30px rgba(31,36,86,.4);transform:translateY(0);transition:transform .3s var(--ease),opacity .3s}
.app.has-mini .screen{padding-bottom:calc(var(--tabh) + var(--safe-b) + 96px)}
.mini.off{transform:translateY(140%);opacity:0;pointer-events:none}
.mini img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.mini .i{flex:1;min-width:0;text-align:left}
.mini .a,.mini .b{display:block}
.mini .a{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .b{font-size:12.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{width:44px;height:44px;border-radius:50%;background:var(--oro);color:var(--noche);display:grid;place-items:center;flex:none}
.mini .mx{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:rgba(255,255,255,.12)}
.mini .mx:active{background:rgba(255,255,255,.25)}
.app.has-mini .fab{bottom:calc(var(--tabh) + var(--safe-b) + 92px)}
.mini .prog{position:absolute;left:16px;right:16px;bottom:3px;height:2px;border-radius:1px;background:rgba(255,255,255,.15);overflow:hidden}
.mini .prog i{display:block;height:100%;background:var(--oro);width:0}

/* ---------- Reproductor a pantalla completa ---------- */
.player{position:absolute;inset:0;z-index:40;color:#fff;background:var(--noche);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s var(--ease);visibility:hidden}
.player.open{transform:none;visibility:visible}
.player .bgimg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.3);opacity:.55;transform:scale(1.1)}
.player .bgveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,36,86,.55) 0%,rgba(31,36,86,.82) 40%,rgba(20,22,58,.97) 100%)}
.player > *{position:relative}
.p-top{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 12px) 14px 6px}
.p-top .tt{flex:1;text-align:center;font-size:13px;line-height:1.3}
.p-top .tt b{display:block;font-size:15px;font-weight:600}
.p-top .tt span{opacity:.7}
.round{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.p-art{display:flex;align-items:center;gap:14px;padding:8px 20px 6px;transition:all .4s var(--ease)}
.p-img{flex:none;padding:0;line-height:0;width:112px;height:112px;border-radius:24px;overflow:hidden;border:3px solid color-mix(in srgb,var(--oro) 80%,transparent);box-shadow:0 0 0 6px rgba(232,182,76,.14),0 10px 26px rgba(0,0,0,.4);transition:all .4s var(--ease)}
.p-art img{width:100%;height:100%;object-fit:cover;transform:scale(1.32);transform-origin:50% 42%;transition:transform .4s var(--ease)}
@media (max-height:720px){.p-img{width:88px;height:88px;border-radius:20px}}
.p-art .sec{font-size:13px;color:var(--oro);font-weight:600}
.p-art h2{font-size:22px;line-height:1.15}
.player.cover .p-art{flex-direction:column;text-align:center;padding-top:20px}
.player.cover .p-img{width:min(82%,330px);height:auto;aspect-ratio:1;border-radius:28px}
.player.cover .p-art img{transform:scale(1)}
/* Foto de la imagen: siempre completa (de la corona a los pies), en un marco vertical con su misma proporción */
.p-art{flex:none}
/* Medidas fijas (proporción 465×684 de la foto), sin aspect-ratio: Safari en iPhone no lo calcula bien en un botón */
.p-img.foto{width:114px;height:168px;aspect-ratio:auto;border-radius:18px}
.p-img.foto img{transform:none;object-fit:contain;display:block;width:100%;height:100%}
@media (max-height:720px){.p-img.foto{width:84px;height:124px;border-radius:14px}}
@media (min-height:800px){.p-img.foto{width:136px;height:200px}}
.p-img{touch-action:manipulation;-webkit-user-select:none;user-select:none}
/* Vista "imagen completa" (doble toque): la imagen ocupa todo el espacio libre y el rezo sigue debajo, línea a línea */
.player.cover .p-art{flex:1 1 0;min-height:0;padding:6px 16px 4px}
.player.cover .p-art > div:last-child,.player.cover .chips{display:none}
.player.cover .p-img.foto{position:relative;flex:1 1 0;min-height:0;width:100%;height:auto;border:0;border-radius:0;background:none;box-shadow:none;overflow:visible}
.player.cover .p-img.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 28px rgba(0,0,0,.55))}
.player.cover .lyrics{flex:0 0 auto;height:27%;min-height:120px;padding:6px 22px 160px}
.player.cover .ly:not(.head){font-size:19px!important}
.player.cover .ly.verse{font-size:20px!important}
.lyrics{flex:1;overflow-y:auto;padding:18vh 24px 22vh;scrollbar-width:none;mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 80%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 80%,transparent 100%)}
.lyrics::-webkit-scrollbar{display:none}
.ly{overflow-wrap:anywhere;font-family:var(--read);font-size:21px;line-height:1.55;margin:0 0 22px;opacity:.32;transition:opacity .45s,transform .45s var(--ease);transform-origin:left center;cursor:pointer}
.ly.verse{white-space:pre-line;font-size:23px;line-height:1.4}

@media (prefers-reduced-motion:reduce){.ly .w{transition:none}}
.ly.head{font-family:var(--display);font-size:15px;opacity:.75;color:var(--oro);margin:34px 0 10px;cursor:default;transform:none}
.ly.head:first-child{margin-top:0}
.ly-int{margin:0 0 22px;padding:16px;border-radius:20px;background:rgba(229,120,155,.18);border:1px solid rgba(229,120,155,.45);opacity:.4;transition:opacity .4s}
.ly-int.now{opacity:1}
.ly-int .h{font-family:var(--display);font-size:19px;color:#FFC4D6}
.ly-int ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ly-int li{font-family:var(--read);font-size:17px;line-height:1.45}
.ly-int li::before{content:"♡ ";color:var(--rosa)}
.ly-int li.dice{color:#FFE3EC;font-weight:600}.ly-int li.dice::before{content:"♥ "}
.ly-int .cd{white-space:nowrap;margin-top:12px;display:flex;align-items:center;gap:10px;font-size:14px}
.ly-int .cd button{margin-left:auto;padding:7px 14px;border-radius:14px;background:rgba(255,255,255,.16);font-weight:600;font-size:13.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:14px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600;color:rgba(255,255,255,.75);white-space:nowrap}
.chip.on{background:var(--oro);color:var(--noche)}
.chip.done{color:rgba(255,255,255,.95)}
.scrub{margin:0 20px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.scrub i{display:block;height:100%;background:linear-gradient(90deg,var(--rosa),var(--oro));width:0;transition:width .4s linear}
.times{display:flex;justify-content:space-between;font-size:12px;opacity:.65;margin:6px 20px 0}
.ctrls{display:flex;align-items:center;justify-content:space-between;padding:10px 26px calc(var(--safe-b) + 22px)}
.ctrls .sm{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.ctrls .sm.lab{width:76px;height:64px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ctrls .sm.lab small{font-size:13px;font-weight:600;opacity:.92;letter-spacing:.01em}
.ctrls .sm.lab:active{background:rgba(255,255,255,.12)}
.gauge .needle{transform-origin:16px 21px;transition:transform .35s var(--ease)}
.ctrls .sm.alt small{color:var(--oro)}
.aa-ic{font-family:var(--display);font-size:20px;line-height:30px;height:30px}.aa-ic span{font-size:29px}
.ctrls .md{width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.ctrls .big{width:76px;height:76px;border-radius:50%;background:var(--oro);color:var(--noche);display:grid;place-items:center;box-shadow:0 10px 30px rgba(232,182,76,.35);transition:transform .12s}
.ctrls .big:active{transform:scale(.94)}
.ctrls svg{width:28px;height:28px}
.ctrls .big svg{width:34px;height:34px}

/* Fin del día */
.done-view{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 38%,rgba(232,182,76,.28),transparent 55%),rgba(20,22,58,.94);opacity:0;pointer-events:none;transition:opacity .5s}
.done-view.on{opacity:1;pointer-events:auto}
.done-view h2{font-size:30px;margin-top:8px}

.btn-w{margin-top:16px;padding:14px 26px;border-radius:24px;background:#fff;color:var(--noche);font-weight:700}
.btn-o{margin-top:10px;padding:12px 22px;border-radius:24px;border:1px solid rgba(255,255,255,.3);font-weight:600}

.row-card .thumb{width:46px;height:46px;border-radius:14px;object-fit:cover;flex:none}
.feats{display:flex;flex-direction:column;gap:12px}

.install-banner{display:flex;align-items:center;gap:12px;margin:14px 20px 0;padding:12px 14px;border-radius:18px;background:var(--noche);color:#fff;text-align:left;width:calc(100% - 40px)}

.install-banner .x2{margin-left:auto;opacity:.7;font-size:20px;padding:4px 6px}
.update-bar{position:absolute;left:12px;right:12px;top:calc(var(--safe-t) + 10px);z-index:58;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--oro);color:var(--noche);font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}

.qr{display:flex;justify-content:center;margin-top:16px}

.linkbox{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:14px;word-break:break-all;color:var(--ink-2)}
.boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-size:22px;color:var(--ink-2)}.boot img{border-radius:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 20px 0}

.tile-dots{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:3px}

.dev-top{display:flex;align-items:center;gap:10px;padding:6px 16px 0}
.dev-top-t{flex:1;text-align:center;font-weight:600;color:var(--ink-2);font-size:14.5px}
.round-btn{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--cenidor);flex:none}
.screen>.enter{zoom:var(--zoom,1)}
.greet{align-items:center}
.aa{flex:none;height:48px;min-width:56px;padding:0 12px;border-radius:24px;background:var(--surface);color:var(--noche);font-family:var(--display);font-size:18px;box-shadow:0 1px 4px rgba(31,36,86,.1)}

.next{margin:16px 20px 0;padding:20px 20px 22px;border-radius:26px;background:var(--surface);box-shadow:0 2px 6px rgba(31,36,86,.06),0 12px 30px rgba(31,36,86,.08)}

.list{margin:0 16px;border-radius:22px;background:var(--surface);overflow:hidden;box-shadow:0 1px 3px rgba(31,36,86,.06)}

.lrow{display:flex;align-items:center;gap:14px;width:100%;min-height:88px;padding:12px 14px 12px 14px;text-align:left;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}

.dev-top{padding:8px 16px 0}

.opt-row>span{flex:1}.opt-row b{display:block;font-size:18px}.opt-row small{display:block;font-size:16px;color:var(--ink-2);margin-top:2px}

  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}

.bi{display:inline-grid;width:22px;height:22px}.bi svg{width:22px;height:22px}

.toast{position:absolute;left:50%;top:calc(var(--safe-t) + 14px);z-index:60;transform:translate(-50%,calc(-100% - var(--safe-t) - 30px));visibility:hidden;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:14px;font-weight:500;transition:transform .35s var(--ease);max-width:88%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{transform:translate(-50%,0);visibility:visible;pointer-events:auto}
.toast{transition:transform .35s var(--ease),visibility 0s linear .35s}.toast.on{transition:transform .35s var(--ease),visibility 0s}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="stage">
<div class="app" id="app">
  <main class="screen" id="screen" tabindex="-1"><div class="boot"><img src="icons/icon-192.png" alt="" width="72" height="72"><div>Hub de Fe</div></div></main>

  <button class="mini off" id="mini" aria-label="Abrir reproductor">
    <img id="miniImg" alt="">
    <span class="i"><span class="a" id="miniA"></span><span class="b" id="miniB"></span></span>
    <span class="pp" id="miniPP" role="button" aria-label="Reproducir o pausar"></span>
    <span class="mx" id="miniX" role="button" aria-label="Cerrar el reproductor"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
    <span class="prog"><i id="miniProg"></i></span>
  </button>

  <nav class="tabs" id="tabs" aria-label="Navegación">
    <button class="tab" data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Inicio</button>
    <button class="tab" data-tab="intenciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Intenciones<span class="badge hidden" id="intBadge"></span></button>
    <button class="tab" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>Recordatorios</button>
  </nav>

  <section class="player" id="player" aria-label="Reproductor de oración">
    <div class="bgimg" id="pBg"></div><div class="bgveil"></div>
    <div class="p-top">
      <button class="round" id="pClose" aria-label="Minimizar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="tt"><span id="pDev"></span><b id="pDay"></b></div>
      <button class="round" id="pView" aria-label="Cambiar vista"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    </div>
    <div class="p-art"><button class="p-img" id="pImgBtn" aria-label="Ver la imagen en grande"><img id="pImg" alt=""></button><div><div class="sec" id="pSec"></div><h2 id="pTitle"></h2></div></div>
    <div class="lyrics" id="lyrics"></div>
    <div class="chips" id="chips"></div>
    <div class="scrub"><i id="pBar"></i></div>
    <div class="times"><span id="tA">0:00</span><span id="tB">0:00</span></div>
    <div class="ctrls">
      <button class="sm lab" id="pSpeed" aria-label="Velocidad de la voz"><svg class="gauge" viewBox="0 0 32 24" width="40" height="30" aria-hidden="true"><path d="M4 21a12 12 0 1 1 24 0" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M8.3 9.6l1.6 1.4M16 5.2v2.2M23.7 9.6l-1.6 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".7"/><g class="needle"><path d="M16 21L16 10" stroke="var(--oro)" stroke-width="2.8" stroke-linecap="round"/></g><circle cx="16" cy="21" r="2.6" fill="var(--oro)"/></svg><small>Velocidad</small></button>
      <button class="md" id="pPrev" aria-label="Párrafo anterior"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
      <button class="big" id="pPlay" aria-label="Reproducir"></button>
      <button class="md" id="pNext" aria-label="Párrafo siguiente"><svg viewBox="0 0 24 24" fill="#fff"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="sm lab" id="pText" aria-label="Tamaño del texto"><span class="aa-ic">A<span>A</span></span><small>Letra</small></button>
    </div>
    <div class="done-view" id="doneView"></div>
  </section>

  <div class="scrim" id="scrim"></div>
  <div class="bsheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panel"></div>
  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Imagen completa"><div class="vimg" id="vImgBox"><img id="vImg" alt=""></div><div class="vbtns"><button class="vrezar" id="vRezar"></button><button class="vcerrar" id="vCerrar">Cerrar</button></div></div>
  <div class="toast" id="toast" role="status"></div>
</div>
</div>
<audio id="aud" preload="auto"></audio>

<script>
"use strict";
/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I={
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  cal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  down:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v12M6 11l6 6 6-6M5 21h14"/></svg>',
  heart:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  loop:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8.6M20 4v4.6h-4.6M20 12a8 8 0 0 1-13.7 5.7L4 15.4M4 20v-4.6h4.6"/></svg>',
};
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseYmd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((parseYmd(ymd(b))-parseYmd(ymd(a)))/864e5);
const fecha=d=>DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()];
const fechaCorta=d=>d.getDate()+" "+MESES[d.getMonth()].slice(0,3);
const rango=(a,b)=>{const A=parseYmd(a),B=parseYmd(b);return a===b?fecha(A):A.getMonth()===B.getMonth()?`${A.getDate()} al ${B.getDate()} de ${MESES[B.getMonth()]}`:`${fechaCorta(A)} al ${fechaCorta(B)}`};
const hora12=h=>{const[a,b]=h.split(":").map(Number);return ((a%12)||12)+":"+String(b).padStart(2,"0")+(a<12?" a. m.":" p. m.")};
const mmss=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const uid=()=>Math.random().toString(36).slice(2,9);
const hoyStr=()=>ymd(new Date());
function toast(m,ms=2600,prio=false){if(!prio&&toast.until>Date.now())return;if(prio)toast.until=Date.now()+ms;const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),ms)}
function saludo(){const h=new Date().getHours();return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"}
const U=dev=>({novena:"Novena",coronilla:"Coronilla",rosario:"Rosario",diaria:"Oración"})[dev.type]||"Rezo";
const SES=t=>t==="coronilla"||t==="rosario"; // una sesión: cada rezo es un ciclo con su intención
const MASC=dev=>dev.type==="rosario"; // «este rosario», «otro rosario»
const esta=dev=>MASC(dev)?"este":"esta", otra=dev=>MASC(dev)?"otro":"otra", rezadaA=dev=>MASC(dev)?"Rezado":"Rezada";
async function setExtra(id,k,on){const st=await devState(id);st.extras=Object.assign({},st.extras,{[k]:on});await Store.set(id,st);if(P.meta&&P.meta.id===id&&!P.playing)P.meta=null;toast(on?"Se rezarán al final del Rosario":"El Rosario terminará sin ellas",1800,true)}
function misterioHoy(dev,d=new Date()){if(dev.type!=="rosario")return 1;const w=d.getDay();return (dev.days.find(x=>x.dias.includes(w))||dev.days[0]).n}
const u=dev=>U(dev).toLowerCase();

/* ================= Almacenamiento ================= */
const Store={db:null,uid:null,cache:{},
  async init(){try{const db=await claude.use("db"),us=await claude.use("user");if(db&&us){const id=await us.id();if(id){this.uid=id;this.db=db}}}catch(e){}},
  lk:id=>"hubdefe:"+id,
  async get(id){
    if(!this.db){ // sin base de datos: leer siempre lo último guardado (otra pestaña pudo cambiarlo)
      let v=null;try{v=JSON.parse(localStorage.getItem(this.lk(id))||"null")}catch(e){}
      if(v&&typeof v==="object"){this.cache[id]=v;return v}
      return this.cache[id]||(this.cache[id]={});
    }
    if(this.cache[id])return this.cache[id];
    let v=null;
    if(this.db){try{const s=await this.db.collection("data/users/"+this.uid).doc(id).get();if(s&&s.exists)v=JSON.parse(JSON.stringify(s.data()))}catch(e){}}
    if(!v){try{v=JSON.parse(localStorage.getItem(this.lk(id))||"null")}catch(e){}}
    v=v||{};this.cache[id]=v;return v},
  async set(id,v){this.cache[id]=v;let okLocal=true;try{localStorage.setItem(this.lk(id),JSON.stringify(v))}catch(e){okLocal=false}
    if(!okLocal&&!this.db&&!this.warned){this.warned=true;toast("No se pudo guardar en este teléfono: la memoria del navegador está llena o bloqueada",6000,true)}
    if(this.db){try{await this.db.collection("data/users/"+this.uid).doc(id).set(JSON.parse(JSON.stringify(v)))}catch(e){console.warn(e)}}}
};
/* doc <idDevoción> = {hora, horas?, hoy?, avisos?, ciclos:[{n,start,done[],fin,creados[],creadosKey,intenciones:[{id,texto,fecha,recibida,desde?}]}]} */
const mkCiclo=(n,start,ints=[])=>({n,start,done:[],fin:null,creados:[],creadosKey:null,intenciones:ints});
function proximoFijo(mmdd){ // próxima fecha fija (p. ej. 16 de diciembre), o la de este año si estamos dentro de la novena
  const[m,d]=mmdd.split("-").map(Number),t=new Date();let s=new Date(t.getFullYear(),m-1,d);
  if(diffDays(s,t)>8)s=new Date(t.getFullYear()+1,m-1,d);return ymd(s)}
async function devState(id){
  const dev=await loadDev(id);const st=await Store.get(id);
  if(Array.isArray(st.ciclos))st.ciclos=st.ciclos.filter(c=>c&&typeof c.n==="number").map(c=>Object.assign(mkCiclo(c.n,c.start||null),c,{done:Array.isArray(c.done)?c.done:[],intenciones:Array.isArray(c.intenciones)?c.intenciones.filter(x=>x&&typeof x.texto==="string"):[],creados:Array.isArray(c.creados)?c.creados:[]}));
  if(Array.isArray(st.ciclos)&&!st.ciclos.length)delete st.ciclos;
  if(!Array.isArray(st.ciclos)){
    let c;
    if(id==="divino-nino"){ // migración desde versiones anteriores
      const p=await Store.get("perfil");
      const ints=[...(st.intenciones||[]).map(t=>({id:uid(),texto:t,fecha:hoyStr(),recibida:null})),...(p.intenciones||[]).map(x=>({id:x.id||uid(),texto:x.texto,fecha:x.fecha||hoyStr(),recibida:x.recibida||null}))];
      c=mkCiclo(1,st.start||null,ints);c.done=st.done||[];c.creados=st.creados||[];c.creadosKey=st.creadosKey||null;
      if(p.intenciones&&p.intenciones.length){p.intenciones=[];await Store.set("perfil",p)}
    }else c=mkCiclo(1,dev.fixedStart?proximoFijo(dev.fixedStart):null);
    for(const k of Object.keys(st))delete st[k];
    st.hora=dev.hora||"20:00";st.ciclos=[c];
    if(dev.type==="diaria"){st.horas=Object.fromEntries(dev.days.map(d=>[d.n,d.hora]));st.hoy={fecha:hoyStr(),done:[]}}
    await Store.set(id,st);
  }
  if(dev.type==="diaria"&&(!st.hoy||st.hoy.fecha!==hoyStr())){st.hoy={fecha:hoyStr(),done:[]}}
  if(dev.type!=="diaria")hidratar(st,await misInt());
  return st;
}
const cur=st=>st.ciclos[st.ciclos.length-1];
/* ===== Intenciones: una sola lista por persona, para todos los rezos =====
   doc "intenciones" = {lista:[{id,texto,fecha,recibida}]}. Cada ciclo (novena, rosario, coronilla) guarda en
   ciclo.intenciones las que se eligieron para él, con el mismo id; el texto y «gracia recibida» viven en la lista general. */
const normInt=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ñ]+/g," ").trim();
let MIGRANDO=null;
async function misInt(){const d=await Store.get("intenciones");
  if(Array.isArray(d.lista))return d;
  if(!MIGRANDO)MIGRANDO=(async()=>{ // primera vez: juntar las intenciones que ya estaban en cada rezo
    const cat=await loadCatalog(),lista=[],por={};
    for(const k of cat.devociones){const st=await Store.get(k.id);if(!Array.isArray(st.ciclos))continue;let cambio=false;
      for(const c of st.ciclos)for(const x of (Array.isArray(c.intenciones)?c.intenciones:[])){if(!x||typeof x.texto!=="string"||!x.texto.trim())continue;
        const n=normInt(x.texto);let g=por[n];
        if(!g){g={id:x.id||uid(),texto:x.texto.trim(),fecha:x.fecha||hoyStr(),recibida:x.recibida||null};por[n]=g;lista.push(g)}
        else if((x.fecha||"9")<g.fecha){g.texto=x.texto.trim();g.fecha=x.fecha} // se queda el texto más antiguo
        else if(x.recibida&&!g.recibida)g.recibida=x.recibida;
        if(x.id!==g.id){x.id=g.id;cambio=true}}
      if(cambio)await Store.set(k.id,st)}
    lista.sort((a,b)=>a.fecha.localeCompare(b.fecha));const nd={lista};await Store.set("intenciones",nd);return nd})();
  return MIGRANDO}
function hidratar(st,G){const by=Object.fromEntries(G.lista.map(g=>[g.id,g]));
  for(const c of st.ciclos)for(const x of c.intenciones){const g=by[x.id];if(g){x.texto=g.texto;x.recibida=g.recibida;delete x.borrada}else x.borrada=true}}
async function agregarInt(textos){const G=await misInt(),ids=[];
  for(const t of textos){const n=normInt(t);if(!n)continue;let g=G.lista.find(x=>normInt(x.texto)===n&&!x.recibida);
    if(!g){g={id:uid(),texto:t.trim(),fecha:hoyStr(),recibida:null};G.lista.push(g)}ids.push(g.id)}
  await Store.set("intenciones",G);setTimeout(prepararVoces,300);return ids}
const activasG=G=>G.lista.filter(x=>!x.recibida);
window.addEventListener("storage",e=>{if(e.key&&e.key.startsWith("hubdefe:")&&!parseHash().day){Store.cache={};onRoute()}});
const activas=c=>c.intenciones.filter(x=>!x.recibida&&!x.borrada);
let caps={};

/* ================= Datos ================= */
let CATALOG=null;const DEVS={};
let CATP=null;const DEVP={};
const loadCatalog=async()=>CATALOG||(CATALOG=await (CATP||(CATP=fetch("catalog.json").then(r=>{if(!r.ok)throw new Error("catalog");return r.json()}))));
const loadDev=async id=>DEVS[id]||(DEVS[id]=await (DEVP[id]||(DEVP[id]=fetch("devociones/"+id+"/data.json").then(r=>{if(!r.ok)throw new Error("dev");return r.json()}))));
loadCatalog().then(c=>c.devociones.forEach(k=>loadDev(k.id))).catch(()=>{}); // todo en paralelo desde el arranque
const byType=async t=>(await loadCatalog()).devociones.filter(k=>k.type===t);
function estado(dev,c){
  const total=dev.days.length,done=new Set(c.done),sig=dev.days.find(d=>!done.has(d.n));
  let hoyN=null;if(c.start)hoyN=diffDays(parseYmd(c.start),new Date())+1;
  const atraso=(c.start&&sig&&hoyN>=1)?Math.max(0,Math.min(hoyN,total)-sig.n):0;
  return{total,done,sig,hoyN,atraso,completa:done.size>=total,empieza:c.start&&hoyN<1}
}
function marcarUso(id){INT_DEV=null;AJ_DEV=null;try{localStorage.setItem("hubdefe:ultimo",id)}catch(e){}}
async function ultimaDev(tipos){const cat=await loadCatalog();let u=null;try{u=localStorage.getItem("hubdefe:ultimo")}catch(e){}
  const ok=cat.devociones.filter(k=>!tipos||tipos.includes(k.type));const f=ok.find(k=>k.id===u);if(f)return f.id;
  for(const k of ok){if(k.type==="diaria")continue;if(activas(cur(await devState(k.id))).length)return k.id} // la que ya tiene intenciones
  return ok[0].id}
/* ================= Custodia (9 rayos = 9 días) ================= */
const Lit=new Set();
function custodia(dev,e,{size=260}={}){
  const c=130,rays=[];
  for(let k=0;k<36;k++){if(k%4===0)continue;
    rays.push(`<path class="ray" d="M ${c-2.2} ${c-76} L ${c} ${c-(k%2?104:112)} L ${c+2.2} ${c-76} Z" fill="var(--oro)" opacity=".28" transform="rotate(${k*10} ${c} ${c})"/>`)}
  dev.days.forEach((d,i)=>{const lit=e.done.has(d.n),today=!e.completa&&e.sig&&e.sig.n===d.n;
    const fill=lit?"var(--oro)":today?"var(--rosa)":"color-mix(in srgb,var(--cenidor) 22%,transparent)";
    rays.push(`<path class="ray ${today?"today":""} ${lit&&Lit.has(d.n)?"lit":""}" d="M ${c-8} ${c-74} L ${c} ${c-128} L ${c+8} ${c-74} Z" fill="${fill}" transform="rotate(${i*40} ${c} ${c})"><title>${esc(d.label)}${lit?" (rezado)":""}</title></path>`)});
  return `<div class="custodia" style="width:${size}px;height:${size}px"><svg viewBox="0 0 260 260" width="${size}" height="${size}" aria-hidden="true">${rays.join("")}</svg><div class="face" role="button" tabindex="0" aria-label="Ver la imagen completa (toca dos veces)" onclick="tocarCustodia()" style="width:${size*.51}px;height:${size*.51}px"><img src="${dev.cover}" alt=""></div></div>`;
}
const medalla=(img,size=150)=>`<div class="medal" style="width:${size}px;height:${size}px"><img src="${img}" alt=""></div>`;

/* ================= Navegación ================= */
let TAB="hoy";
function parseHash(){const h=location.hash.slice(1);const m=h.match(/^(.+)-dia-(\d+)$/);
  if(m)return{dev:m[1],day:+m[2]};if(["hoy","devociones","intenciones","ajustes"].includes(h))return{tab:h};if(h&&h!=="inicio")return{nov:h};return{tab:"hoy"}}
async function onRoute(){
  const r=parseHash();
  const cat=await loadCatalog();const valid=id=>cat.devociones.some(k=>k.id===id);
  if((r.day&&(!valid(r.dev)||r.day<1||r.day>cat.devociones.find(k=>k.id===r.dev).days))||(r.nov&&!valid(r.nov))){
    toast("Ese enlace no corresponde a ninguna oración. Te llevo al inicio.");history.replaceState(null,"","#hoy");return onRoute()}
  if(r.day){await openPlayer(r.dev,r.day);return}
  closePlayer(false);
  if(r.nov){await renderDev(r.nov);setTabs("devociones");return}
  TAB=r.tab;setTabs(TAB);
  await ({hoy:renderHoy,devociones:renderDevociones,intenciones:renderIntenciones,ajustes:renderAjustes})[TAB]();
}
function setTabs(t){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t))}
function go(h){if(location.hash==="#"+h)onRoute();else location.hash=h}

/* ---------- estado breve de cada devoción (igual para todas) ---------- */
async function resumen(k){
  const dev=await loadDev(k.id),st=await devState(k.id),c=cur(st),r={id:k.id,dev,st,c};
  if(dev.type==="novena"){const e=estado(dev,c);r.e=e;
    r.estado=e.completa?`Novena #${c.n} completada`:e.empieza?`Empieza el ${fechaCorta(parseYmd(c.start))}`:(c.start||e.done.size)?`Día ${e.sig.n} de 9${e.atraso>0?", va atrasada":""}`:`Nueve días, ${dev.days[0].mins} minutos al día`;
    r.enCurso=!e.completa&&c.start&&!e.empieza;
    r.pendienteHoy=r.enCurso&&e.hoyN>=e.sig.n; // le toca hoy (o va atrasada)
  }else if(SES(dev.type)){const n=st.ciclos.filter(x=>x.fin===hoyStr()).length;r.hechaHoy=n>0;
    const dh=dev.days.find(x=>x.n===misterioHoy(dev));r.hoyDia=dh;
    r.estado=n?`${rezadaA(dev)} hoy${n>1?" ("+n+" veces)":""}`:dev.type==="rosario"?`Hoy: ${dh.title}`:`${dh.mins} minutos`;
  }else{r.estado=`${st.hoy.done.length} de ${dev.days.length} hoy`}
  return r;
}
const minutos=h=>+h.slice(0,2)*60+ +h.slice(3);
async function paraHoy(lista){ // solo lo pendiente de hoy, según lo que cada persona tiene en curso
  const now=new Date().getHours()*60+new Date().getMinutes(),rows=[];
  for(const r of lista){
    if(r.dev.type==="novena"&&r.pendienteHoy){const d=r.e.sig;rows.push({h:r.st.hora,t:r.dev.title,s:`${d.label}, ${d.mins} minutos`,img:r.dev.cover,go:`${r.id}-dia-${d.n}`})}
    if(SES(r.dev.type)&&!r.hechaHoy&&now>=minutos(r.st.hora)-120)rows.push({h:r.st.hora,t:r.dev.title,s:r.dev.type==="rosario"?`${r.hoyDia.title}, ${r.hoyDia.mins} minutos`:`${r.hoyDia.mins} minutos, con tu intención`,img:r.dev.cover,go:`${r.id}-dia-${r.hoyDia.n}`});
    if(r.dev.type==="diaria"){const pend=r.dev.days.filter(d=>!r.st.hoy.done.includes(d.n)&&now>=minutos(r.st.horas[d.n]||d.hora)-90);
      const d=pend[pend.length-1];if(d)rows.push({h:r.st.horas[d.n]||d.hora,t:d.title,s:`${d.mins} minutos`,img:d.img,go:`${r.id}-dia-${d.n}`})}
  }
  rows.sort((a,b)=>a.h.localeCompare(b.h));
  // la principal: la más reciente que ya llegó (o la próxima); las demás, en orden de hora
  let k=-1;rows.forEach((r,i)=>{if(minutos(r.h)<=now)k=i});if(k<0)k=0;
  if(k>0)rows.unshift(rows.splice(k,1)[0]);
  return rows.slice(0,4);
}

/* ================= Elegir intenciones antes de rezar =================
   modo "rezo": antes de cada Rosario o Coronilla · "inicio": antes del primer día de una novena
   modo "nueva": empezar otra novena (con fecha) · "editar": cambiar las de la novena en curso */
async function sheetElegirInt(id,n,modo){
  const dev=await loadDev(id),st=await devState(id),c=cur(st),G=await misInt(),un=u(dev);
  let pre=new Set(activas(c).map(x=>x.id));
  if(!pre.size){const ant=[...st.ciclos].reverse().find(k=>k!==c&&k.intenciones.length);if(ant)pre=new Set(ant.intenciones.filter(x=>!x.recibida&&!x.borrada).map(x=>x.id))}
  const lista=activasG(G);
  const ini=dev.fixedStart?proximoFijo(dev.fixedStart):hoyStr();
  const tit=modo==="nueva"?"Nueva novena":modo==="editar"?"Intenciones de esta novena":"¿Por qué intenciones rezas?";
  const sub=modo==="nueva"?`${esc(dev.title)}. Elige tus intenciones para la novena #${c.n+1} o escribe una nueva.`
    :modo==="editar"?"Marca las intenciones que presentas en esta novena. La voz las lee cada día."
    :`Marca las de tu lista o escribe una nueva. La voz las presentará durante ${dev.type==="novena"?"cada día de la novena":esta(dev)+" "+un}.`;
  openSheet(`<h3>${tit}</h3><div class="sub">${sub}</div>
    ${lista.length?`<div class="pick-h">Tus intenciones</div><div class="picks" id="elPicks">${lista.map(x=>`<label class="pick big"><input type="checkbox" value="${x.id}" ${pre.has(x.id)?"checked":""}><span><span class="pt">${esc(x.texto)}</span><span class="ps">Desde el ${fechaCorta(parseYmd(x.fecha))}</span></span></label>`).join("")}</div>`:""}
    <div class="pick-h">${lista.length?"O escribe una nueva":"Escribe tu intención"}</div>
    <textarea id="elTx" placeholder="Te pido por…" maxlength="600" style="min-height:76px;margin-top:6px"></textarea>
    ${sugsHtml("elTx")}
    ${modo==="nueva"?`<div class="pick-h">Día primero</div><input type="date" id="elStart" value="${ini}" class="date-in">`:""}
    <button class="btn-p" id="elOk" onclick="elegirOk('${id}',${n||0},'${modo}',true)">Empezar a rezar</button>
    ${modo==="editar"?"":`<button class="btn-p ghost" onclick="elegirOk('${id}',${n||0},'${modo}',false)">Rezar sin intención</button>`}`);
  const cuenta=()=>{const k=document.querySelectorAll("#elPicks input:checked").length+lineas($("#elTx").value).length;
    $("#elOk").textContent=modo==="editar"?(k?`Guardar ${k} ${k===1?"intención":"intenciones"}`:"Guardar sin intenciones"):modo==="nueva"?`Empezar la novena #${c.n+1}${k?` con ${k} ${k===1?"intención":"intenciones"}`:""}`:k?`Empezar a rezar con ${k} ${k===1?"intención":"intenciones"}`:"Empezar a rezar"};
  document.querySelectorAll('.sugs[data-for="elTx"] button').forEach((b,k)=>{if(lista.some(x=>normInt(x.texto)===normInt(SUGS[k])))b.hidden=true}); // ya están en su lista
  conSugs("elTx",cuenta);document.querySelectorAll("#elPicks input").forEach(i=>i.onchange=cuenta);cuenta();
}
async function elegirOk(id,n,modo,usar){
  let ids=usar?[...document.querySelectorAll("#elPicks input:checked")].map(i=>i.value):[];
  if(usar){const nuevos=await agregarInt(lineas($("#elTx").value||""));nuevos.forEach(x=>{if(!ids.includes(x))ids.push(x)})}
  const G=await misInt(),by=Object.fromEntries(G.lista.map(g=>[g.id,g]));
  const sel=ids.filter(x=>by[x]).map(x=>({id:x,texto:by[x].texto,fecha:hoyStr(),recibida:null}));
  const st=await devState(id);let c=cur(st);
  if(modo==="nueva"){if(!c.fin)c.fin=hoyStr();const nc=mkCiclo(c.n+1,($("#elStart")&&$("#elStart").value)||hoyStr(),sel);nc.preguntado=true;st.ciclos.push(nc);c=nc}
  else{c.intenciones=sel;c.preguntado=true}
  await Store.set(id,st);closeSheet();P.reset();badge();
  if(modo==="nueva"){toast(`Novena #${c.n} iniciada${sel.length?` con ${sel.length} ${sel.length===1?"intención":"intenciones"}`:""}`,3200);go(id);return}
  if(modo==="editar"){toast(sel.length?`${sel.length} ${sel.length===1?"intención":"intenciones"} en esta novena`:"Novena sin intenciones",2200);if(TAB==="intenciones")renderIntenciones();else onRoute();return}
  P.meta=null;if(location.hash!=="#"+id+"-dia-"+n)location.hash=id+"-dia-"+n;else openPlayer(id,n)}

async function dondeSeReza(){ // id de intención → rezos en curso donde está elegida
  const cat=await loadCatalog(),m={};
  for(const k of cat.devociones){if(k.type==="diaria")continue;const dev=await loadDev(k.id),st=await devState(k.id),c=cur(st);
    const enCurso=dev.type==="novena"?!estado(dev,c).completa:!c.fin;if(!enCurso)continue;
    for(const x of activas(c))(m[x.id]=m[x.id]||[]).push(k.short)}
  return m}

/* Velocidad de la voz: una sola preferencia por persona, para todos los rezos.
   Escala de 75 % a 125 % en pasos de 5 %: por debajo de 75 % el estiramiento del audio se vuelve artificial,
   y por encima de 125 % la oración deja de entenderse con comodidad, sobre todo para personas mayores. */
const VELS=[.75,.8,.85,.9,.95,1,1.05,1.1,1.15,1.2,1.25];
const VEL_N={75:"Muy despacio",80:"Despacio",85:"Pausado",90:"Algo pausado",95:"Un poco pausado",100:"Normal",105:"Un poco ágil",110:"Algo ágil",115:"Ágil",120:"Rápido",125:"Muy rápido"};

async function openPlayer(id,n){marcarUso(id);

    // Antes de cada Rosario o Coronilla, y antes del primer día de cada novena: ¿por qué intenciones rezas?
    const nueva=SES(dev.type)||(!c.done.length&&!c.fin);

/* Voz de las intenciones (texto del usuario) */
/* Las intenciones escritas a mano se convierten en audio dentro del teléfono (voz neural en español, Piper es_MX)
   al guardarlas, y el audio queda en IndexedDB. Así se oyen como cualquier oración: aunque el iPhone esté en
   silencio, con la velocidad elegida y sin internet. La voz del teléfono queda solo como respaldo. */
const VOZ_ID="es_MX-claude-high";
const IDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open("hubdefe-voz",1);r.onupgradeneeded=()=>r.result.createObjectStore("audio");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){const db=await this.open();return new Promise(res=>{const q=db.transaction("audio").objectStore("audio").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})},
  async set(k,v){const db=await this.open();return new Promise(res=>{const t=db.transaction("audio","readwrite");t.objectStore("audio").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})}};
let TTS=null,TTS_AVISO=false;
function motorVoz(){if(!TTS)TTS=import("./vendor/vits.js").then(()=>window.tts).catch(e=>{TTS=null;throw e});return TTS}
const URLS={};
/* Misma regla de pausas que la voz de los rezos: 0,20 s de silencio antes y 0,93 s después de cada frase
   (medido en los audios de Salomé). La velocidad al hablar ya es la misma (±5 %). */
async function rellenarWav(blob,lead=.20,tail=.93){try{const buf=new Uint8Array(await blob.arrayBuffer()),dv=new DataView(buf.buffer);
  const sr=dv.getUint32(24,true),bps=dv.getUint16(34,true)/8*dv.getUint16(22,true);
  let p=12;while(p<buf.length-8&&String.fromCharCode(...buf.subarray(p,p+4))!=="data")p+=8+dv.getUint32(p+4,true);
  const datos=buf.subarray(p+8,p+8+dv.getUint32(p+4,true));
  // quitar el silencio que ya trae (muestras casi en cero) y poner el de la regla
  const pcm=new Int16Array(datos.buffer.slice(datos.byteOffset,datos.byteOffset+datos.byteLength)),um=328;
  let a=0,b=pcm.length-1;while(a<b&&Math.abs(pcm[a])<um)a++;while(b>a&&Math.abs(pcm[b])<um)b--;
  const voz=pcm.subarray(a,b+1),L=Math.round(lead*sr),T=Math.round(tail*sr),out=new Int16Array(L+voz.length+T);out.set(voz,L);
  const h=new ArrayBuffer(44),w=new DataView(h),str=(o,t)=>{for(let i=0;i<4;i++)w.setUint8(o+i,t.charCodeAt(i))};
  str(0,"RIFF");w.setUint32(4,36+out.byteLength,true);str(8,"WAVE");str(12,"fmt ");w.setUint32(16,16,true);w.setUint16(20,1,true);w.setUint16(22,1,true);
  w.setUint32(24,sr,true);w.setUint32(28,sr*2,true);w.setUint16(32,2,true);w.setUint16(34,16,true);str(36,"data");w.setUint32(40,out.byteLength,true);
  return new Blob([h,out.buffer],{type:"audio/wav"})}catch(e){return blob}}
async function audioIntencion(texto,generar=true){const k=VOZ_ID+"|p2|"+normInt(texto);
  if(URLS[k])return URLS[k];
  try{let b=await IDB.get(k);
    if(!b&&generar){const tts=await motorVoz();
      if(!TTS_AVISO&&!(await tts.stored()).includes(VOZ_ID)){TTS_AVISO=true;toast("Preparando la voz que leerá tus intenciones…",3500,true)}
      b=await tts.predict({text:texto.replace(/[.!?¡¿]*$/,"")+".",voiceId:VOZ_ID});if(b)b=await rellenarWav(b);if(b){await IDB.set(k,b);try{localStorage.setItem("hubdefe:voz-lista","1")}catch(e){}}}
    if(b){URLS[k]=URL.createObjectURL(b);return URLS[k]}}catch(e){}
  return null}
let PREP=null,PREP_OTRA=false;
function prepararVoces(){ // genera en segundo plano la voz de las intenciones escritas a mano
  if(PREP){PREP_OTRA=true;return PREP} // si llega una intención nueva mientras tanto, se hace otra pasada al terminar
  if(!navigator.onLine&&!TTS)return null;
  PREP=(async()=>{do{PREP_OTRA=false;try{const G=await misInt(),fr=await cargarFrases();
    for(const x of activasG(G)){if(fr&&fr.sugerencias[x.texto])continue;await audioIntencion(x.texto)}}catch(e){}}while(PREP_OTRA);PREP=null})();return PREP}
let FRASES=null;
function cargarFrases(){if(!FRASES)FRASES=fetch("frases.json").then(r=>r.ok?r.json():null).catch(()=>null);return FRASES}
/* En iPhone la voz del teléfono solo funciona si se activó con un toque: se activa en el primer «reproducir» */
let VOZ_LISTA=false;function activarVoz(){try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  if(VOZ_LISTA||!("speechSynthesis" in window))return;VOZ_LISTA=true;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function vocesListas(){return new Promise(r=>{if(speechSynthesis.getVoices().length)return r();const t=setTimeout(r,1200);speechSynthesis.addEventListener("voiceschanged",()=>{clearTimeout(t);r()},{once:true})})}
function vozEs(){const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));if(!vs.length)return null;
  const reg=v=>/es[-_](CO|MX|US|419|AR|CL|PE|VE)/i.test(v.lang)?0:1,cal=v=>/natural|neural|premium|enhanced|mejorad/i.test(v.name)?0:/paulina|m[oó]nica|helena|google|sabina|juana|isabela/i.test(v.name)?1:2;
  return vs.slice().sort((a,b)=>cal(a)-cal(b)||reg(a)-reg(b))[0]}
async function speakEs(text,tk,rate){ // nunca espera más de lo razonable, aunque la voz del teléfono no responda
  const limite=new Promise(r=>setTimeout(r,Math.max(5000,text.length*110/rate)));
  return Promise.race([speakEs0(text,tk,rate),limite]);
}
async function speakEs0(text,tk,rate){
  if(caps.tts){try{await caps.tts.speak(text,{voice:"airy",rate:Math.max(.7,Math.min(1.5,rate*.95))});return}catch(e){if(tk!==P.tk)return}}
  if("speechSynthesis" in window){await vocesListas();await new Promise(res=>{const ut=new SpeechSynthesisUtterance(text);const vz=vozEs();ut.voice=vz;ut.lang=vz?vz.lang:"es-MX";ut.rate=.95*rate;
    ut.onend=res;ut.onerror=res;speechSynthesis.speak(ut);const k=setInterval(()=>{if(tk!==P.tk){speechSynthesis.cancel();clearInterval(k);res()}},300)})}
}

/* Service worker: modo sin conexión y aviso de nueva versión */
let swReg=null;
function avisoActualizacion(w){if($("#updBar"))return;const d=document.createElement("div");d.className="update-bar";d.id="updBar";
  d.innerHTML='Hay una nueva versión de Hub de Fe <button>Actualizar</button>';d.querySelector("button").onclick=()=>{w.postMessage("skipWaiting")};$("#app").appendChild(d)}
async function buscarActualizacion(manual){if(!swReg){if(manual)toast(IN_CLAUDE?"Dentro de Claude siempre ves la última versión":"Las actualizaciones no están disponibles en este navegador");return}
  try{await swReg.update()}catch(e){}if(swReg.waiting)avisoActualizacion(swReg.waiting);else if(manual)toast("Ya tienes la última versión ("+APP_VERSION+")")}
if("serviceWorker" in navigator&&!IN_CLAUDE&&(location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js").then(reg=>{swReg=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)avisoActualizacion(reg.waiting);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)avisoActualizacion(w)})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{})});
  }).catch(()=>{});
  let recargado=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(recargado)return;recargado=true;location.reload()});
}
